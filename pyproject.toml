[project]
name = "codepilot-review-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22"]

[tool.pytest.ini_options]
pythonpath = ["."]

